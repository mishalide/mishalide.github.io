<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #f3f0e8;
  --bg2:       #ede9dc;
  --border:    #b8b2a0;
  --border2:   #cdc8ba;
  --text:      #2a2620;
  --text-dim:  #7a7268;
  --accent:    #c8441a;
  --win-bar:   #e8e4d8;
  --win-body:  #f5f2ea;
  --mono:      'IBM Plex Mono', monospace;
  --sans:      'IBM Plex Sans', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body {
  width:100vw; height:100vh; overflow:hidden;
  font-family: var(--sans); font-size:12px; color:var(--text);
  background-color: var(--bg);
  background-image:
    linear-gradient(45deg, var(--bg2) 25%, transparent 25%),
    linear-gradient(-45deg, var(--bg2) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--bg2) 75%),
    linear-gradient(-45deg, transparent 75%, var(--bg2) 75%);
  background-size: 24px 24px;
  background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
}
/* Menubar */
#menubar {
  position:fixed; top:0; left:0; right:0; height:28px;
  background:var(--bg); border-bottom:1.5px solid var(--border);
  display:flex; align-items:center; padding:0 12px; gap:0;
  z-index:9999; font-family:var(--mono); font-size:11px;
}
#menubar-logo { font-weight:600; font-size:11px; letter-spacing:.08em; margin-right:14px; color:var(--accent); }
.menu-item { padding:0 10px; height:28px; display:flex; align-items:center; color:var(--text); cursor:pointer; letter-spacing:.03em; }
.menu-item:hover { background:var(--accent); color:#fff; }
#menubar-right { margin-left:auto; color:var(--text-dim); font-size:11px; }
/* Taskbar */
#taskbar {
  position:fixed; bottom:0; left:0; right:0; height:36px;
  background:var(--bg); border-top:1.5px solid var(--border);
  display:flex; align-items:center; padding:0 8px; gap:4px; z-index:9999;
}
.taskbar-btn {
  height:24px; padding:0 10px; background:var(--win-bar);
  border:1.5px solid var(--border); color:var(--text); cursor:pointer;
  font-size:10px; font-family:var(--mono); white-space:nowrap;
  display:flex; align-items:center; letter-spacing:.02em;
}
.taskbar-btn:hover { background:var(--border2); }
.taskbar-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
#clock { margin-left:auto; color:var(--text-dim); font-size:11px; font-family:var(--mono); }
/* Desktop */
#desktop {
  position:absolute; inset:28px 0 36px 0;
  overflow:hidden;
}
/* Icons */
.icon {
  position:absolute;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  width:82px; padding:8px 4px 6px; cursor:pointer; text-align:center;
  border:1.5px solid transparent;
}
.icon:hover { background:rgba(200,68,26,.07); border-color:rgba(200,68,26,.2); }
.icon.selected { background:rgba(200,68,26,.13); border-color:var(--accent); }
.icon.dragging { opacity:0.75; z-index:500; }
.icon img { width:48px; height:48px; object-fit:contain; display:block; border-radius:12px; }
.icon-label { font-size:10px; font-family:var(--mono); color:var(--text); word-break:break-all; line-height:1.3; max-width:78px; }
/* Windows */
.window {
  position:absolute; min-width:300px; min-height:200px;
  background:var(--win-body); border:1.5px solid var(--border);
  box-shadow:3px 3px 0 var(--border2);
  display:flex; flex-direction:column; overflow:hidden;
}
.window.focused { z-index:1000; border-color:var(--text); box-shadow:4px 4px 0 rgba(40,32,20,.18); }
.window.minimized { display:none; }
.titlebar {
  height:30px; background:var(--win-bar); border-bottom:1.5px solid var(--border);
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; padding:0; cursor:move; flex-shrink:0;
}
.titlebar-left {
  display:flex; align-items:center; padding:0 8px; gap:5px;
}
.titlebar-icon {
  font-size:13px; opacity:0.7; flex-shrink:0;
}
.titlebar-title {
  font-family:var(--mono); font-size:11px; font-weight:500; color:var(--text);
  text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  letter-spacing:.03em; padding:0 8px;
}
.win-btns { display:flex; flex-shrink:0; height:30px; }
.win-btn {
  width:36px; height:30px; border:none; border-left:1px solid var(--border2);
  background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-family:var(--mono); font-weight:500; color:var(--text-dim); line-height:1;
}
.win-btn:hover { background:var(--border2); color:var(--text); }
.win-btn.btn-close:hover { background:#c8441a; color:#fff; }
/* focused state — subtle, not coloured titlebar */
.window.focused .titlebar { background:var(--win-bar); border-bottom-color:var(--border); }
.window.focused .titlebar-title { color:var(--text); font-weight:600; }
.window.focused .win-btn { color:var(--text); }

.window-body {
  flex:1; padding:18px 20px; overflow:auto; color:var(--text);
  font-size:12px; line-height:1.75; font-family:var(--sans);
  user-select:text;
}
.window-body h1 { font-family:var(--mono); font-size:15px; font-weight:600; color:var(--accent); margin:0 0 10px; letter-spacing:.04em; }
.window-body h2 { font-family:var(--mono); font-size:13px; font-weight:600; color:var(--text); margin:14px 0 6px; }
.window-body h3 { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--text); margin:10px 0 4px; }
.window-body p  { color:var(--text-dim); margin:2px 0 6px; }
.window-body ul { padding-left:16px; color:var(--text-dim); margin:4px 0; }
.window-body li { margin:2px 0; }
.window-body hr { border:none; border-top:1px solid var(--border); margin:10px 0; }
.window-body strong { color:var(--text); font-weight:600; }
.window-body em { color:var(--text-dim); font-style:italic; }
.window-body code { font-family:var(--mono); font-size:10px; background:var(--bg2); padding:1px 4px; border-radius:2px; }
.window-body a { color:var(--accent); }
.win-statusbar {
  height:20px; background:var(--win-bar); border-top:1px solid var(--border2);
  display:flex; align-items:center; padding:0 8px;
  font-family:var(--mono); font-size:9px; color:var(--text-dim); flex-shrink:0; gap:16px;
}
/* Resize edges and corners */
.rh { position:absolute; }
.rh-n  { top:-4px;    left:8px;    right:8px;  height:8px;  cursor:n-resize; }
.rh-s  { bottom:-4px; left:8px;    right:8px;  height:8px;  cursor:s-resize; }
.rh-e  { right:-4px;  top:8px;     bottom:8px; width:8px;   cursor:e-resize; }
.rh-w  { left:-4px;   top:8px;     bottom:8px; width:8px;   cursor:w-resize; }
.rh-nw { top:-4px;    left:-4px;   width:12px; height:12px; cursor:nw-resize; }
.rh-ne { top:-4px;    right:-4px;  width:12px; height:12px; cursor:ne-resize; }
.rh-sw { bottom:-4px; left:-4px;   width:12px; height:12px; cursor:sw-resize; }
.rh-se { bottom:-4px; right:-4px;  width:12px; height:12px; cursor:se-resize; }
/* Visual grip dot in bottom-right */
.rh-se::after {
  content:''; position:absolute; right:4px; bottom:4px;
  width:8px; height:8px;
  border-right:2px solid var(--border); border-bottom:2px solid var(--border);
}
/* Cookie banner */
#cookie-banner {
  position:fixed; bottom:44px; right:16px;
  z-index:99998;
  background:var(--win-body); border:1.5px solid var(--text);
  box-shadow:4px 4px 0 rgba(40,32,20,.18);
  padding:14px 14px 14px 16px;
  width:380px; max-width:calc(100vw - 32px);
  display:flex; gap:0; align-items:stretch;
  font-family:var(--sans); font-size:12px; color:var(--text);
  animation: cookieSlideIn 0.3s ease;
  overflow:hidden;
  border-radius:6px;
}
@keyframes cookieSlideIn {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
#cookie-banner.hide {
  animation: cookieSlideOut 0.25s ease forwards;
}
@keyframes cookieSlideOut {
  to { opacity:0; transform:translateY(16px); }
}
#cookie-banner .cb-text { flex:1; min-width:0; padding-right:12px; }
#cookie-banner .cb-title {
  font-family:var(--mono); font-size:11px; font-weight:600;
  color:var(--text); margin-bottom:5px; letter-spacing:.03em;
}
#cookie-banner .cb-body {
  font-size:11px; color:var(--text-dim); line-height:1.55;
}
#cookie-banner .cb-body p { margin:0 0 4px; }
#cookie-banner .cb-body a {
  color:var(--accent); text-decoration:none; border-bottom:1px dashed var(--accent);
}
#cookie-banner .cb-dismiss {
  position:absolute; top:8px; right:8px;
  width:20px; height:20px;
  background:transparent; border:1.5px solid var(--border2);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); font-size:13px; font-family:var(--mono);
  transition:background .1s, color .1s; border-radius:3px;
}
#cookie-banner .cb-dismiss:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
#cookie-banner .cb-ursula {
  flex-shrink:0; width:110px;
  display:flex; align-items:flex-end; justify-content:center;
  margin:-14px -14px -14px 0;
  overflow:hidden; border-radius:0 6px 6px 0;
}
#cookie-banner .cb-ursula img {
  width:120px; display:block;
  object-fit:cover; object-position:top center;
  border-radius:0 6px 6px 0;
}
#cookie-banner .cb-credit {
  font-size:9px; color:var(--text-dim); margin-top:6px; font-family:var(--mono);
}
#cookie-banner .cb-credit a { color:var(--text-dim); border-bottom:1px dashed var(--border); }
</style>
</head>
<body>

<!-- COOKIE BANNER -->
<div id="cookie-banner">
  <div class="cb-text">
    <div class="cb-title">Legally-required cookie banner</div>
    <div class="cb-body">
      <p>This site doesn't use any cookies. Zero. None. Not even a crumb.</p>
      <p>No data is sent anywhere. (<a href="https://en.wikipedia.org/wiki/Ursula_von_der_Leyen" target="_blank">Ursula von der Leyen</a> would be so proud.)</p>
      <p class="cb-credit">Banner inspired by <a href="https://posthog.com" target="_blank">PostHog</a> ♥</p>
    </div>
  </div>
  <button class="cb-dismiss" onclick="dismissCookie()" title="Close">&#215;</button>
  <div class="cb-ursula">
    <img src="https://res.cloudinary.com/dmukukwp6/image/upload/c_scale,w_180/v1/posthog.com/src/components/EU/images/ursula" alt="Ursula von der Leyen, President of the European Commission">
  </div>
</div>

<!-- BOOT SCREEN -->
<div id="boot" style="
  position:fixed;inset:0;z-index:99999;
  background:#1a1714;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;color:#c8b89a;
  padding:48px 56px;
  display:flex;flex-direction:column;gap:0;
  overflow:hidden;
  cursor:pointer;
" onclick="dismissBoot()">
  <div id="boot-lines" style="display:flex;flex-direction:column;gap:4px;"></div>
  <div id="boot-cursor" style="margin-top:20px;color:#c8441a;display:none;">
    [ press any key or click to continue ]
  </div>
</div>

<div id="menubar">
  <span id="menubar-logo">◈ PORTFOLIO</span>
  <span class="menu-item" onclick="openAppById('terminal')" style="font-size:11px;">Terminal</span>
  <span id="menubar-right"></span>
</div>
<div id="desktop"></div>
<div id="taskbar"><div id="clock"></div></div>

let zCounter = 100;
const openWindows = {};

const desktop = document.getElementById('desktop');
const ICON_COLS = 1; // icons per column before wrapping
const ICON_W = 90, ICON_H = 90, ICON_PAD = 14;

APPS.forEach((app, idx) => {
  const col = Math.floor(idx / 8);
  const row = idx % 8;
  const x = ICON_PAD + col * ICON_W;
  const y = ICON_PAD + row * ICON_H;

  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.dataset.id = app.id;
  icon.style.left = x + 'px';
  icon.style.top  = y + 'px';
  icon.innerHTML = `<img src="${app.img}" alt="${app.label}"><div class="icon-label">${app.label}</div>`;

  // Click to select + open
  icon.addEventListener('mousedown', e => {
    document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
    icon.classList.add('selected');
  });
  icon.addEventListener('click', () => { if (!didDrag) openApp(app); });

  // Drag
  let didDrag = false;
  icon.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    didDrag = false;
    const startX = e.clientX, startY = e.clientY;
    const origL = icon.offsetLeft, origT = icon.offsetTop;
    const desktopRect = desktop.getBoundingClientRect();

    function onMove(e) {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!didDrag && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      didDrag = true;
      icon.classList.add('dragging');
      let nl = origL + dx;
      let nt = origT + dy;
      // clamp inside desktop
      nl = Math.max(0, Math.min(desktopRect.width  - icon.offsetWidth,  nl));
      nt = Math.max(0, Math.min(desktopRect.height - icon.offsetHeight, nt));
      icon.style.left = nl + 'px';
      icon.style.top  = nt + 'px';
    }
    function onUp() {
      icon.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (didDrag) {
        // snap to grid
        const GRID = 90;
        icon.style.left = Math.round(icon.offsetLeft / GRID) * GRID + 'px';
        icon.style.top  = Math.round(icon.offsetTop  / GRID) * GRID + 'px';
        // swallow the next click so it doesn't open the app
        icon.addEventListener('click', e => e.stopImmediatePropagation(), { capture: true, once: true });
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  desktop.appendChild(icon);
});

function openAppById(id) {
  const app = APPS.find(a => a.id === id);
  if (app) openApp(app);
}

function updateClock() {
  const now = new Date();
  const t = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  const d = now.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
  document.getElementById('clock').textContent = t;
  document.getElementById('menubar-right').textContent = d + '   ' + t;
}
updateClock(); setInterval(updateClock, 1000);

function miniMd(text) {
  // minimal markdown → HTML renderer
  const lines = text.split('\n');
  let html = '';
  let inList = false;
  for (let line of lines) {
    if (/^### (.+)/.test(line))       { if(inList){html+='</ul>';inList=false;} html += `<h3>${line.slice(4)}</h3>`; }
    else if (/^## (.+)/.test(line))   { if(inList){html+='</ul>';inList=false;} html += `<h2>${line.slice(3)}</h2>`; }
    else if (/^# (.+)/.test(line))    { if(inList){html+='</ul>';inList=false;} html += `<h1>${line.slice(2)}</h1>`; }
    else if (/^- (.+)/.test(line))    { if(!inList){html+='<ul>';inList=true;} html += `<li>${mdInline(line.slice(2))}</li>`; }
    else if (/^\*\*\*/.test(line))    { if(inList){html+='</ul>';inList=false;} html += '<hr>'; }
    else if (line.trim() === '')      { if(inList){html+='</ul>';inList=false;} html += '<br>'; }
    else                              { if(inList){html+='</ul>';inList=false;} html += `<p>${mdInline(line)}</p>`; }
  }
  if (inList) html += '</ul>';
  return html;
}
function mdInline(s) {
  return s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank">$1</a>');
}

async function loadAppContent(app, bodyEl) {
  if (app.isDir) {
    // show directory listing from FS
    const parts = app.srcFile.split('/').filter(Boolean);
    let node = FS;
    for (const p of parts) {
      if (!node.children || !node.children[p]) { node = null; break; }
      node = node.children[p];
    }
    if (node && node.children) {
      bodyEl.innerHTML =
        `<h3 style="font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px">${app.label}</h3>` +
        Object.entries(node.children).map(([name, child]) =>
          `<div style="margin:4px 0">` +
          (child.srcFile
            ? `<span style="font-family:var(--mono);font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline"
                onclick="openFileFromDir('${child.srcFile}','${name}')">${name}</span>`
            : `<span style="font-family:var(--mono);font-size:11px;color:var(--text-dim)">${name}</span>`) +
          `</div>`
        ).join('');
    }
    return;
  }
  if (!app.srcFile) return;
  bodyEl.innerHTML = `<span style="font-family:var(--mono);font-size:10px;color:var(--text-dim)">loading...</span>`;
  try {
    console.log('[loadAppContent] fetching:', app.srcFile);
    const res = await fetch(app.srcFile);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    console.log('[loadAppContent] got', text.length, 'chars');
    bodyEl.innerHTML = miniMd(text);
  } catch(e) {
    // show error clearly so we can debug — no silent fallback
    bodyEl.innerHTML = `
      <span style="font-family:var(--mono);font-size:10px;color:var(--accent)">
        fetch failed: ${app.srcFile}<br>
        <span style="color:var(--text-dim)">${e}</span>
      </span>`;
    console.error('fetch failed for', app.srcFile, e);
  }
}

function focusWindow(win, id) {
  document.querySelectorAll('.window').forEach(w => w.classList.remove('focused'));
  win.classList.add('focused'); win.style.zIndex = ++zCounter;
  document.querySelectorAll('.taskbar-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.taskbar-btn[data-id="${id}"]`)?.classList.add('active');
}
function closeWindow(id) {
  openWindows[id]?.remove(); delete openWindows[id];
  document.querySelector(`.taskbar-btn[data-id="${id}"]`)?.remove();
}
function minimizeWindow(id) {
  openWindows[id]?.classList.add('minimized');
  document.querySelector(`.taskbar-btn[data-id="${id}"]`)?.classList.remove('active');
}
const maxState = {};
function toggleMaximize(win) {
  const id = Object.entries(openWindows).find(([,w])=>w===win)?.[0];
  if (!id) return;
  if (maxState[id]) { Object.assign(win.style, maxState[id]); delete maxState[id]; }
  else { maxState[id]={left:win.style.left,top:win.style.top,width:win.style.width,height:win.style.height}; win.style.cssText+=';left:0;top:28px;width:100vw;height:calc(100vh - 64px)'; }
}
function addTaskbarBtn(app) {
  const btn = document.createElement('div');
  btn.className = 'taskbar-btn active'; btn.dataset.id = app.id; btn.textContent = app.label;
  btn.onclick = () => {
    const win = openWindows[app.id]; if (!win) return;
    if (win.classList.contains('minimized')) { win.classList.remove('minimized'); focusWindow(win,app.id); }
    else if (win.classList.contains('focused')) { minimizeWindow(app.id); }
    else { focusWindow(win,app.id); }
  };
  document.getElementById('taskbar').insertBefore(btn, document.getElementById('clock'));
}
function makeDraggable(win, handle) {
  handle.addEventListener('mousedown', e => {
    if (e.target.closest('.win-btn')) return;
    e.preventDefault();
    const ox=e.clientX-win.offsetLeft, oy=e.clientY-win.offsetTop;
    const move=e=>{win.style.left=Math.max(0,e.clientX-ox)+'px';win.style.top=Math.max(28,Math.min(window.innerHeight-64,e.clientY-oy))+'px';};
    const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}

function fsGetNode(pathParts) {
  let node = FS;
  for (const p of pathParts) {
    if (!node.children || !(p in node.children)) return null;
    node = node.children[p];
  }
  return node;
}

function fsNormalize(path, cwdParts) {
  const parts = path.startsWith('/') ? [] : [...cwdParts];
  for (const seg of path.split('/').filter(Boolean)) {
    if (seg === '.') continue;
    else if (seg === '..') { if (parts.length) parts.pop(); }
    else parts.push(seg);
  }
  return parts;
}

function fmtPath(parts) { return '/' + parts.join('/'); }

function initTerminal(el) {
  let cwdParts = []; // root = []
  const hist = [];
  let histIdx = -1;

  function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function prompt() {
    const p = fmtPath(cwdParts);
    return `<span style="color:#c8441a;font-weight:600">portfolio</span><span style="color:#5a5248">:</span><span style="color:#8ab4c8">${escH(p)}</span><span style="color:#5a5248"> $ </span>`;
  }

  function printHTML(html) {
    const row = document.createElement('div');
    row.style.cssText = 'line-height:1.65;white-space:pre-wrap;word-break:break-all;';
    row.innerHTML = html;
    el.insertBefore(row, el.lastElementChild);
    el.scrollTop = el.scrollHeight;
  }

  function printLine(text, color) {
    printHTML(`<span${color ? ` style="color:${color}"` : ''}>${escH(text)}</span>`);
  }

  function newInputRow() {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;flex-shrink:0;';
    const ps = document.createElement('span');
    ps.innerHTML = prompt();
    ps.style.whiteSpace = 'nowrap';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.style.cssText = 'flex:1;min-width:0;background:transparent;border:none;outline:none;color:#c8b89a;font-family:inherit;font-size:inherit;caret-color:#c8441a;';
    row.appendChild(ps);
    row.appendChild(inp);
    el.appendChild(row);
    el.scrollTop = el.scrollHeight;
    setTimeout(() => inp.focus(), 0);

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const cmd = inp.value;
        // freeze the row
        ps.innerHTML = prompt();
        row.removeChild(inp);
        const frozen = document.createElement('span');
        frozen.textContent = cmd;
        row.appendChild(frozen);
        if (cmd.trim()) { hist.unshift(cmd); histIdx = -1; }
        runCmd(cmd.trim());
        newInputRow();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histIdx < hist.length - 1) inp.value = hist[++histIdx];
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        histIdx > 0 ? (inp.value = hist[--histIdx]) : (inp.value = '', histIdx = -1);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        const parts = inp.value.split(' ');
        const partial = parts[parts.length - 1];
        const node = fsGetNode(cwdParts);
        if (node && node.children) {
          const matches = Object.keys(node.children).filter(k => k.startsWith(partial));
          if (matches.length === 1) {
            const match = matches[0];
            parts[parts.length-1] = match + (node.children[match].type==='dir' ? '/' : '');
            inp.value = parts.join(' ');
          } else if (matches.length > 1) {
            printLine(matches.join('  '), '#7a7268');
          }
        }
      } else if (e.key === 'l' && e.ctrlKey) {
        e.preventDefault();
        el.innerHTML = '';
        newInputRow();
      }
    });
  }

  function runCmd(raw) {
    if (!raw) return;
    const tokens = raw.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g) || [];
    const cmd = tokens[0];
    const args = tokens.slice(1).map(a => a.replace(/^['"]|['"]$/g,''));

    switch (cmd) {

      case 'help':
        printHTML([
          `<span style="color:#bc5861;font-weight:600">commands</span>`,
          `  <span style="color:#bc5861 ">ls</span> [path]       list directory`,
          `  <span style="color:#bc5861">cd</span> &lt;path&gt;       change directory`,
          `  <span style="color:#bc5861">cat</span> &lt;file&gt;      print file contents`,
          `  <span style="color:#bc5861">pwd</span>             working directory`,
          `  <span style="color:#bc5861">mkdir</span> &lt;name&gt;    create directory`,
          `  <span style="color:#bc5861">touch</span> &lt;name&gt;    create empty file`,
          `  <span style="color:#bc5861">rm</span> &lt;name&gt;       remove file`,
          `  <span style="color:#bc5861">echo</span> &lt;text&gt;     print text`,
          `  <span style="color:#bc5861">tree</span>            directory tree`,
          `  <span style="color:#bc5861">clear</span>           clear terminal  (ctrl+l)`,
          `  <span style="color:#bc5861">neofetch</span>        system info`,
          `  <span style="color:#bc5861">whoami</span>          current user`,
        ].join('\n'));
        break;

      case 'pwd':
        printLine(fmtPath(cwdParts));
        break;

      case 'whoami':
        printLine('visitor');
        break;

      case 'echo':
        printLine(args.join(' '));
        break;

      case 'clear':
        el.innerHTML = '';
        break;

      case 'ls': {
        const target = args[0] ? fsNormalize(args[0], cwdParts) : cwdParts;
        const node = fsGetNode(target);
        if (!node) { printLine(`ls: ${args[0] || '.'}: no such file or directory`, '#c8441a'); break; }
        if (node.type !== 'dir') { printLine(target[target.length-1]); break; }
        const entries = Object.entries(node.children || {})
          .sort(([,a],[,b]) => a.type === b.type ? 0 : a.type==='dir' ? -1 : 1);
        const cols = entries.map(([name, n]) =>
          n.type === 'dir'
            ? `<span style="color:#8ab4c8;font-weight:600">${escH(name)}/</span>`
            : `<span style="color:#c8b89a">${escH(name)}</span>`
        );
        printHTML(cols.join('  ') || '<span style="color:#5a5248">(empty)</span>');
        break;
      }

      case 'cd': {
        const target = args[0] === undefined ? [] : args[0] === '-' ? cwdParts : fsNormalize(args[0], cwdParts);
        const node = fsGetNode(target);
        if (!node) { printLine(`cd: ${args[0]}: no such file or directory`, '#c8441a'); break; }
        if (node.type !== 'dir') { printLine(`cd: ${args[0]}: not a directory`, '#c8441a'); break; }
        cwdParts = target;
        // update prompt on input row
        const lastRow = el.lastElementChild;
        if (lastRow) { const ps = lastRow.firstElementChild; if (ps) ps.innerHTML = prompt(); }
        break;
      }

      case 'cat': {
        if (!args[0]) { printLine('cat: missing operand', '#c8441a'); break; }
        const target = fsNormalize(args[0], cwdParts);
        const node = fsGetNode(target);
        if (!node) { printLine(`cat: ${args[0]}: no such file or directory`, '#c8441a'); break; }
        if (node.type === 'dir') { printLine(`cat: ${args[0]}: is a directory`, '#c8441a'); break; }
        if (node.srcFile) {
          fetch(node.srcFile)
            .then(r => r.ok ? r.text() : Promise.reject(`HTTP ${r.status}`))
            .then(txt => printLine(txt, '#d4c9a8'))
            .catch(() => printLine(node.content || '(no content)', '#d4c9a8'));
        } else {
          printLine(node.content || '', '#d4c9a8');
        }
        break;
      }

      case 'mkdir': {
        if (!args[0]) { printLine('mkdir: missing operand', '#c8441a'); break; }
        const parent = fsGetNode(cwdParts);
        if (!parent || parent.type !== 'dir') break;
        if (parent.children[args[0]]) { printLine(`mkdir: ${args[0]}: file exists`, '#c8441a'); break; }
        parent.children[args[0]] = { type:'dir', children:{} };
        break;
      }

      case 'touch': {
        if (!args[0]) { printLine('touch: missing operand', '#c8441a'); break; }
        const parent = fsGetNode(cwdParts);
        if (!parent || parent.type !== 'dir') break;
        if (!parent.children[args[0]]) parent.children[args[0]] = { type:'file', content:'' };
        break;
      }

      case 'rm': {
        if (!args[0]) { printLine('rm: missing operand', '#c8441a'); break; }
        const parts = fsNormalize(args[0], cwdParts);
        const parentNode = fsGetNode(parts.slice(0,-1));
        const name = parts[parts.length-1];
        if (!parentNode || !parentNode.children || !(name in parentNode.children)) {
          printLine(`rm: ${args[0]}: no such file or directory`, '#c8441a'); break;
        }
        if (parentNode.children[name].type === 'dir' && !args.includes('-r') && !args.includes('-rf')) {
          printLine(`rm: ${args[0]}: is a directory (use -r)`, '#c8441a'); break;
        }
        delete parentNode.children[name];
        break;
      }

      case 'tree': {
        function renderTree(node, prefix) {
          const entries = Object.entries(node.children || {});
          entries.forEach(([name, child], i) => {
            const last = i === entries.length - 1;
            const conn = last ? '└── ' : '├── ';
            const color = child.type === 'dir' ? '#8ab4c8' : '#c8b89a';
            printHTML(`<span style="color:#5a5248">${escH(prefix+conn)}</span><span style="color:${color};font-weight:${child.type==='dir'?'600':'400'}">${escH(name)}${child.type==='dir'?'/':''}</span>`);
            if (child.type === 'dir') renderTree(child, prefix + (last ? '    ' : '│   '));
          });
        }
        printHTML(`<span style="color:#8ab4c8;font-weight:600">/</span>`);
        renderTree(FS, '');
        break;
      }

      case 'neofetch': {
        const art = [
          `   <span style="color:#bc5861 ">  idk how to do ascii art tbh  </span>`,
          `   <span style="color:#bc5861 "> (  o  )</span>`,
          `   <span style="color:#bc5861 ">  \\___/ </span>`,
          `   <span style="color:#bc5861 "> /|   |\\</span>`,
          `   <span style="color:#bc5861 ">  |   | </span>`,
        ];
        const inf = [
          `<span style="color:#bc5861 ;font-weight:600">visitor</span><span style="color:#5a5248">@</span><span style="color:#bc5861;font-weight:600">portfolio</span>`,
          `<span style="color:#5a5248">─────────────────────────</span>`,
          `<span style="color:#bc5861 ">OS</span>:      MishaOS v1.0.1`,
          `<span style="color:#bc5861 ">Host</span>:    550-111no 1.04`,
          `<span style="color:#bc5861 ">Kernel</span>:    5.15.112`,
          `<span style="color:#bc5861 ">Uptime</span>:    at least 4 femtoseconds`,
          `<span style="color:#bc5861 ">Resolution</span>:    dunno, have you tried opening display settings?`,
          `<span style="color:#bc5861 ">CPU</span>:     Cortical Labs CL1 · 1× wetware core`,
          `<span style="color:#bc5861 ">Memory</span>: 31KB/640 KB (in this economy?)`,
          `<span style="color:#bc5861 ">Shell</span>:   portfolio-sh 1.0`,
          `<span style="color:#bc5861 ">Theme</span>:   whatever i could think of`,
          ``,
          `<span style="background:#bc5861 ">  </span> <span style="background:#e8a020">  </span> <span style="background:#28c840">  </span> <span style="background:#8ab4c8">  </span> <span style="background:#c8b89a">  </span> <span style="background:#5a5248">  </span>`,
        ];
        const rows = Math.max(art.length, inf.length);
        for (let i = 0; i < rows; i++) {
          const a = art[i] || '           ';
          const b = inf[i] || '';
          printHTML(`${a}   ${b}`);
        }
        printLine('');
        break;
      }

      default:
        printLine(`${cmd}: command not found  (try 'help')`, '#c8441a');
    }
  }

  printLine("Portfolio OS terminal  -  type 'help' for commands", '#5a5248');
  printLine('');
  newInputRow();

  // click anywhere → focus input
  el.addEventListener('click', () => {
    const inp = el.querySelector('input');
    if (inp) inp.focus();
  });
}

let camStream = null;
function startCam() {
  const video = document.getElementById('cam-feed');
  const status = document.getElementById('cam-status');
  const btn = document.getElementById('cam-btn');
  if (camStream) {
    camStream.getTracks().forEach(t=>t.stop());
    camStream = null;
    video.srcObject = null;
    btn.textContent = 'START CAMERA';
    status.textContent = 'camera stopped';
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then(stream => {
      camStream = stream;
      video.srcObject = stream;
      btn.textContent = 'STOP CAMERA';
      status.textContent = 'camera live';
    })
    .catch(err => {
      status.textContent = 'error: ' + err.message;
    });
}
function snapPhoto() {
  const video = document.getElementById('cam-feed');
  const canvas = document.getElementById('cam-snap');
  const status = document.getElementById('cam-status');
  if (!camStream) { status.textContent = 'start camera first'; return; }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.style.display = 'block';
  status.textContent = 'photo taken!';
}

function makeResizable(win) {
  win.querySelectorAll('.rh').forEach(handle => {
    handle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const dir = handle.dataset.dir;
      const sx=e.clientX, sy=e.clientY;
      const sw=win.offsetWidth, sh=win.offsetHeight;
      const sl=win.offsetLeft, st=win.offsetTop;
      const move = e => {
        const dx=e.clientX-sx, dy=e.clientY-sy;
        let nl=sl, nt=st, nw=sw, nh=sh;
        if(dir.includes('e')) nw = Math.max(300, sw+dx);
        if(dir.includes('s')) nh = Math.max(200, sh+dy);
        if(dir.includes('w')){ nw = Math.max(300, sw-dx); nl = sl+sw-nw; }
        if(dir.includes('n')){ nh = Math.max(200, sh-dy); nt = st+sh-nh; }
        win.style.width  = nw+'px';
        win.style.height = nh+'px';
        win.style.left   = nl+'px';
        win.style.top    = nt+'px';
      };
      const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',move);
      document.addEventListener('mouseup',up);
    });
  });
}

const BOOT_LINES = [
  '                                                    ',
  '',
  'American Megatrends, Inc.  BIOS v2.4.1',
  '────────────────────────────────────────────────────',
  'CPU: Cortical Labs CL1 Biological Processing Unit',
  '     1 x wetware core  @  ~30 Hz  [ALIVE]',
  'RAM: 640 KB (that ought to be enough for anyone)',
  'DISPLAY: 1 × Retina  [OK]',
  'STORAGE: works/  projects/  gallery/  [OK]',
  'AUDIO: music.app  [OK]',
  'CAMERA: camera.app  [OK]',
  '────────────────────────────────────────────────────',
  'Initialising desktop environment...',
  '▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓  100%',
  '',
  'Press any key to continue  (auto-skipping in 1s...)',
];
let bootDone = false;
function runBoot() {
  const container = document.getElementById('boot-lines');
  let i = 0;
  // staggered line reveal
  function nextLine() {
    if (i >= BOOT_LINES.length) {
      document.getElementById('boot-cursor').style.display = 'block';
      bootDone = true;
      autoSkipTimer = setTimeout(dismissBoot, 1000);
      return;
    }
    const div = document.createElement('div');
    const line = BOOT_LINES[i];
    div.style.opacity = '0';
    div.style.transition = 'opacity 0.15s';
    // colour certain lines
    if (line.includes('ENERGY STAR')) {
        div.style.color = '#7a7268'; div.style.fontSize = '10px';
      } else if (line.startsWith('──')) div.style.color = '#5a5248';
    else if (line.includes('[OK]') || line.includes('[ALIVE]')) {
      div.innerHTML = line.replace('[OK]', '<span style="color:#28c840">[OK]</span>');
    } else if (line.includes('100%')) {
      div.style.color = '#c8441a';
      div.textContent = line;
    } else {
      div.textContent = line;
    }
    container.appendChild(div);
    requestAnimationFrame(() => { div.style.opacity = '1'; });
    i++;
    // vary speed for drama ✨✨✨ (im losing it) (this doesn't work)
    const delay = line.startsWith('──') ? 80 : line.includes('▓') ? 600 : line === '' ? 200 : 120;
    setTimeout(nextLine, delay);
  }
  nextLine();
}
let autoSkipTimer = null;
function dismissBoot() {
  if (!bootDone) return;
  if (autoSkipTimer) { clearTimeout(autoSkipTimer); autoSkipTimer = null; }
  const boot = document.getElementById('boot');
  if (!boot) return;
  boot.style.transition = 'opacity 0.4s';
  boot.style.opacity = '0';
  setTimeout(() => {
    if(boot.parentNode) boot.remove();
    const aboutApp = APPS.find(a => a.id === 'about');
    if (aboutApp) openApp(aboutApp);
  }, 420);
}
document.addEventListener('keydown', dismissBoot);
document.addEventListener('DOMContentLoaded', () => setTimeout(runBoot, 200));

function dismissCookie() {
  const banner = document.getElementById('cookie-banner');
  if (!banner) return;
  banner.classList.add('hide');
  setTimeout(() => banner.remove(), 280);
}
